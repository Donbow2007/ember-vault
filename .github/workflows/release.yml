name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Validate release version
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: Build portable source package
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="ember-vault-$GITHUB_REF_NAME/" -o "dist/ember-vault-$GITHUB_REF_NAME.tar.gz" HEAD
          cd dist
          sha256sum "ember-vault-$GITHUB_REF_NAME.tar.gz" > "ember-vault-$GITHUB_REF_NAME.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
