# Ember Vault model catalog
#
# GGUF binaries are intentionally not committed to Git. The app/model tooling
# downloads them into storage/models on the same drive as Ember Vault.
#
# Before promoting a candidate to a default model, pin the exact upstream
# repository, GGUF filename, SHA-256 checksum, license, and expected size here.

models:
