    status: benchmark_candidate
  survival-llama-1b:
    role: survival
    display_name: Survival Llama 1B candidate
    filename: survival-llama-1b.gguf
    status: benchmark_candidate
  survival-gemma-1b:
    role: survival
    display_name: Survival Gemma 1B candidate
    filename: survival-gemma-1b.gguf
    status: benchmark_candidate
